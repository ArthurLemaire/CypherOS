# Dependency updates, batched so they do not flood the PR list.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web:
        patterns: ["*"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
