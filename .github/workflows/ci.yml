name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Windows is not a supported platform yet (the shell tool assumes a POSIX shell); it runs
    # so we can see how far off it is, but cannot fail the build.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        shell: bash
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check openmuse tests

      - name: Ruff format
        run: uv run ruff format --check openmuse tests

      - name: Mypy
        run: uv run mypy

      - name: Tests (no live LLM calls)
        run: uv run python -m pytest -q -m "not live"

      - name: Package builds and installs
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          uv build
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/openmuse version

  web:
    name: web app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Type-check and build
        run: npm run build
        working-directory: web
      - name: Built app is committed
        run: |
          if [ -n "$(git status --porcelain openmuse/server/static)" ]; then
            echo "openmuse/server/static is out of date — run 'cd web && npm run build' and commit the result"
            git status --porcelain openmuse/server/static
            exit 1
          fi

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: openmuse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm openmuse:ci version
