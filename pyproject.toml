[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dots-runtime"
version = "0.4.0"
description = "An always-on, goal-driven agent runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "the dots contributors" }]
keywords = ["agents", "llm", "automation", "asyncio", "runtime"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
vector = ["numpy>=1.26"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/MuseTeaParty/Tea-Party"
Documentation = "https://github.com/MuseTeaParty/Tea-Party/tree/main/docs"
Issues = "https://github.com/MuseTeaParty/Tea-Party/issues"

[project.scripts]
dots = "dots.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dots"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=dots --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/dots"]

[tool.coverage.run]
branch = true
source = ["dots"]
